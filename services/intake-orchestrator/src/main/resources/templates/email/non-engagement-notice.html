<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title>Sobre su consulta</title>
  <!--[if mso]><style>table,td{font-family:Arial,sans-serif !important;}</style><![endif]-->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body{margin:0;padding:0;background:#E8E2D6;}
    table{border-collapse:collapse;}
    a{text-decoration:none;}
    @media only screen and (max-width:620px){ .card{width:100% !important;} .px{padding-left:22px !important;padding-right:22px !important;} }
  </style>
</head>
<body>
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Sobre su consulta.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#E8E2D6;">
    <tr><td align="center" style="padding:32px 12px;">
      <table role="presentation" class="card" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background-color:#ffffff;border:1px solid #15120F;">
        <tr><td style="background-color:#15120F;padding:20px 32px;" class="px"><div style="font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:19px;color:#FAF8F4;letter-spacing:-0.01em;">{{firm_name}}</div></td></tr>
        <tr><td style="padding:36px 32px 28px;border-bottom:1px solid #E2DBCE;" class="px"><div style="font-family:'JetBrains Mono','Courier New',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#877E6C;margin-bottom:10px;">Respuesta a su consulta</div><div style="font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-0.02em;color:#15120F;">Sobre su consulta</div><div style="font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.55;color:#4A443A;margin-top:12px;">{{salutation}}</div></td></tr>
        <tr><td style="padding:24px 32px;border-bottom:1px solid #E2DBCE;" class="px"><div style="font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.6;color:#322E27;white-space:pre-line;">{{non_engagement_notice}}</div></td></tr><tr><td style="padding:24px 32px;border-bottom:1px solid #E2DBCE;" class="px"><div style="font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.6;color:#322E27;">Cordialmente,<br>Equipo de consultas<br><strong>{{firm_name}}</strong></div></td></tr>
        <tr><td style="background-color:#FAF8F4;padding:18px 32px;" class="px"><div style="font-family:'JetBrains Mono','Courier New',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#877E6C;margin-bottom:6px;">Aviso</div><div style="font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-size:13px;line-height:1.55;color:#4A443A;">Este mensaje no constituye asesor&iacute;a legal y no crea una relaci&oacute;n abogado-cliente.</div></td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
